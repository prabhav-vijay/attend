name: Feature request
description: Suggest a useful improvement or new feature for Attend.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for a new capability or a change to an existing one. For open-ended brainstorming, use GitHub Discussions instead.

  - type: checkboxes
    id: existing-request
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions for a similar idea.
          required: true

  - type: dropdown
    id: app-area
    attributes:
      label: Which part of Attend would this improve?
      options:
        - Attendance calendar / marking attendance
        - Semester setup / academic dates
        - Subjects / timetable
        - Holidays / events
        - Attendance percentage / forecasts
        - Reports / import / export
        - Browser storage / data persistence
        - Accessibility / usability
        - Other / multiple areas
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain the task or frustration you are trying to address.
      placeholder: As a student, I find it difficult to ...
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: What would you like Attend to do?
      description: Describe the behaviour or workflow you have in mind. Screenshots or simple examples are welcome.
      placeholder: It would help if Attend could ...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Have you found a workaround or considered another approach?
      placeholder: I currently work around this by ...
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Optional. Add examples, mock-ups, or links that help explain the request. Do not include personal attendance data.
    validations:
      required: false
