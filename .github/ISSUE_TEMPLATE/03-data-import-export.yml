name: Data import or export problem
description: Report a problem importing, exporting, or restoring Attend data.
title: "[Data]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        This form is for JSON/CSV imports and exports, backups, restores, or data that does not appear to persist correctly.

        **Do not attach a real attendance backup or export.** These files may contain sensitive academic information. Reproduce the problem with fabricated data and share only a redacted example of the structure if needed.

  - type: checkboxes
    id: existing-issue
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for a similar data-handling problem.
          required: true

  - type: dropdown
    id: operation
    attributes:
      label: Which operation failed?
      options:
        - Export to JSON
        - Export to CSV
        - Import JSON
        - Import CSV
        - Restore previously exported data
        - Data missing after reload
        - Other / not sure
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Where did this happen?
      options:
        - Live website (https://attend-pv.vercel.app/)
        - Local development version
        - Both
        - Not sure
    validations:
      required: true

  - type: textarea
    id: actual-result
    attributes:
      label: What happened?
      description: Include any error message, missing fields, or incorrect result. Use fabricated test data.
      placeholder: The import/export ...
    validations:
      required: true

  - type: textarea
    id: expected-result
    attributes:
      label: What did you expect to happen?
      placeholder: I expected ...
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to reproduce
      description: Give a numbered sequence using fabricated test data. Do not upload your real export file.
      placeholder: |
        1. Create a test semester ...
        2. Add a test subject ...
        3. Export/import ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: sanitized-context
    attributes:
      label: Sanitized sample or other context
      description: Optional. Include only a small fabricated example with no real personal data.
      placeholder: Paste a made-up example or describe the file structure.
    validations:
      required: false
